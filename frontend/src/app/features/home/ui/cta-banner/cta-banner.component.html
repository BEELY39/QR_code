<section class="bg-white px-4 py-10 dk:px-8 dk:py-28">
  <div class="mx-auto w-full max-w-qc">
    <div class="flex flex-col items-center gap-4 rounded-qc-xl bg-qc-accent px-5.5 py-9 text-center text-white dk:gap-6 dk:rounded-qc-hero dk:px-12 dk:py-18">
      <h2 class="font-qc-display text-[30px] font-bold leading-[1.1] tracking-[-0.03em] dk:text-qc-h2-cta dk:max-w-[760px]">{{ content().title }}</h2>
      @if (content().lead) {
        <p class="hidden max-w-[560px] text-[18px] leading-[1.6] text-qc-on-accent-muted dk:block">{{ content().lead }}</p>
      }
      <div class="flex w-full flex-col gap-3 dk:w-auto dk:flex-row dk:flex-wrap dk:justify-center dk:gap-3">
        <a qcButton="light" qcSize="xl" [qcBlock]="true" [href]="content().primary.href" class="dk:!w-auto dk:h-13">{{ content().primary.label }}</a>
        <a qcButton="ghost-accent" qcSize="xl" [qcBlock]="true" [href]="content().secondary.href" class="dk:!w-auto dk:h-13 dk:font-semibold">{{ content().secondary.label }}</a>
      </div>
    </div>
  </div>
</section>
