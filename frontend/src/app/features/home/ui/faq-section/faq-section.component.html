<section id="faq" class="bg-qc-surface py-14 dk:py-28">
  <div class="mx-auto flex w-full max-w-qc flex-col gap-3.5 px-4 dk:grid dk:grid-cols-2 dk:items-start dk:gap-16 dk:px-8">

    <div class="flex flex-col gap-4">
      <span class="text-[12px] font-semibold uppercase tracking-[0.08em] text-qc-accent dk:text-[13px]">{{ content.eyebrow }}</span>
      <h2 class="font-qc-display text-qc-h2-m font-bold tracking-[-0.03em] dk:text-qc-h2 text-qc-text">{{ content.title }}</h2>
      <a [routerLink]="content.guides.href" id="guides" class="hidden font-semibold text-qc-text no-underline dk:block">{{ content.guides.label }}</a>
    </div>

    <div class="flex flex-col gap-2.5">
      @for (item of faqs(); track item.id; let i = $index) {
        <div class="{{ i >= mobileCount ? 'hidden dk:block' : 'block' }} overflow-hidden rounded-qc-card bg-white dk:rounded-qc-card">
          <button
            type="button"
            [id]="'faq-btn-' + item.id"
            class="flex w-full cursor-pointer items-center justify-between gap-4 px-4.5 py-4 text-left dk:px-6 dk:py-5.5"
            [attr.aria-expanded]="isOpen(item.id)"
            [attr.aria-controls]="'faq-panel-' + item.id"
            (click)="toggleFaq(item.id)">
            <span class="text-[15px] font-semibold dk:text-[16px]">{{ item.question }}</span>
            <span class="shrink-0 text-qc-muted transition-transform duration-200 {{ isOpen(item.id) ? 'rotate-90' : '' }}">
              <qc-icon name="chevron-right" [size]="18" />
            </span>
          </button>

          @if (isOpen(item.id)) {
            <div
              [id]="'faq-panel-' + item.id"
              role="region"
              [attr.aria-labelledby]="'faq-btn-' + item.id"
              class="px-4.5 pb-4 text-[14px] leading-[1.6] text-qc-muted dk:px-6 dk:pb-5.5 dk:text-[15px]">
              {{ item.answer }}
            </div>
          }
        </div>
      }

      <a [routerLink]="content.guidesMobile.href" class="mt-1 font-semibold text-qc-text no-underline dk:hidden">{{ content.guidesMobile.label }}</a>
    </div>
  </div>
</section>
