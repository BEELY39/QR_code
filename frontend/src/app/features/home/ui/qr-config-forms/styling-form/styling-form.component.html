<form [formGroup]="stylingForm" class="space-y-6">
  <!-- Section Forme des Modules -->
  <div class="space-y-3">
    <div class="flex items-center justify-between">
      <label class="text-xs font-bold uppercase tracking-wider text-qc-muted flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base text-qc-accent">grain</span>
        Style des motifs (Dots)
      </label>
      <span class="text-xs text-qc-muted font-medium">6 designs</span>
    </div>

    <!-- Grille de cartes de styles -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      @for (style of dotStyles; track style.value) {
        <button
          type="button"
          (click)="selectDotStyle(style.value)"
          class="relative flex items-start gap-3 p-3.5 rounded-qc-card border text-left transition-all duration-200 group focus:outline-none focus-visible:ring-2 focus-visible:ring-qc-accent"
          [class.border-qc-accent]="isSelected(style.value)"
          [class.bg-qc-accent/5]="isSelected(style.value)"
          [class.ring-2]="isSelected(style.value)"
          [class.ring-qc-accent]="isSelected(style.value)"
          [class.border-qc-input-line]="!isSelected(style.value)"
          [class.bg-qc-surface]="!isSelected(style.value)"
          [class.hover:border-qc-input-line]="!isSelected(style.value)"
          [class.hover:bg-qc-neutral-bg]="!isSelected(style.value)"
        >
          <!-- Badge Icône / Aperçu -->
          <div 
            class="w-10 h-10 rounded-qc-md flex items-center justify-center shrink-0 transition-colors"
            [class.bg-qc-accent]="isSelected(style.value)"
            [class.text-white]="isSelected(style.value)"
            [class.bg-qc-neutral-bg]="!isSelected(style.value)"
            [class.text-qc-muted]="!isSelected(style.value)"
          >
            <span class="material-symbols-outlined text-xl">{{ style.iconName }}</span>
          </div>

          <!-- Libellé & Description -->
          <div class="flex-1 min-w-0 pr-6">
            <h4 
              class="text-sm font-semibold truncate transition-colors"
              [class.text-qc-accent]="isSelected(style.value)"
              [class.text-qc-text]="!isSelected(style.value)"
            >
              {{ style.label }}
            </h4>
            <p class="text-xs text-qc-muted mt-0.5 line-clamp-1">
              {{ style.description }}
            </p>
          </div>

          <!-- Radio indicateur discret -->
          <div 
            class="absolute top-3.5 right-3.5 w-4 h-4 rounded-full border flex items-center justify-center transition-colors"
            [class.border-qc-accent]="isSelected(style.value)"
            [class.bg-qc-accent]="isSelected(style.value)"
            [class.border-qc-input-line]="!isSelected(style.value)"
          >
            @if (isSelected(style.value)) {
              <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
            }
          </div>
        </button>
      }
    </div>
  </div>
</form>
