<div class="space-y-4">
  <div class="flex items-center justify-between">
    <label class="text-xs font-bold uppercase tracking-wider text-qc-muted flex items-center gap-1.5">
      <span class="material-symbols-outlined text-base text-qc-accent">add_photo_alternate</span>
      Logo central du QR Code
    </label>
    <span class="text-xs text-qc-muted font-medium">Optionnel</span>
  </div>

  <!-- Message d'erreur -->
  @if (error()) {
    <div class="flex items-center gap-2 p-3 bg-red-600/10 border border-red-600/20 rounded-qc-md text-xs text-red-600">
      <span class="material-symbols-outlined text-base shrink-0">error</span>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- Zone active avec Logo déjà importé -->
  @if (currentLogo()) {
    <div class="flex items-center gap-4 p-4 bg-qc-surface rounded-qc-card border border-qc-input-line">
      <!-- Aperçu miniature avec damier de transparence -->
      <div class="relative w-20 h-20 rounded-qc-md overflow-hidden border border-qc-input-line/30 bg-white shadow-sm shrink-0 flex items-center justify-center p-2">
        <img [src]="currentLogo()" alt="Aperçu du logo" class="w-full h-full object-contain" />
      </div>

      <!-- Informations & Actions -->
      <div class="flex-1 min-w-0">
        <h4 class="text-sm font-semibold text-qc-text truncate">Logo importé avec succès</h4>
        <p class="text-xs text-qc-muted mt-0.5">Visible au centre du QR code</p>

        <div class="flex items-center gap-3 mt-3">
          <!-- Bouton Remplacer -->
          <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-qc-neutral-bg hover:bg-qc-neutral-bg text-qc-text text-xs font-semibold rounded-lg cursor-pointer transition-colors">
            <span class="material-symbols-outlined text-sm">swap_horiz</span>
            Remplacer
            <input
              type="file"
              class="hidden"
              accept=".png,.jpg,.jpeg,.svg"
              (change)="onFileSelected($event)"
            />
          </label>

          <!-- Bouton Supprimer -->
          <button
            type="button"
            (click)="removeLogo()"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-red-600 hover:bg-red-600/10 text-xs font-semibold rounded-lg transition-colors"
          >
            <span class="material-symbols-outlined text-sm">delete</span>
            Supprimer
          </button>
        </div>
      </div>
    </div>
  } @else {
    <!-- Zone Drag & Drop vide -->
    <div
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      class="relative flex flex-col items-center justify-center p-8 rounded-qc-card border-2 border-dashed transition-all duration-200 text-center cursor-pointer group"
      [class.border-qc-accent]="isDragging()"
      [class.bg-qc-accent/5]="isDragging()"
      [class.border-qc-input-line]="!isDragging()"
      [class.bg-qc-surface]="!isDragging()"
      [class.hover:border-qc-accent/50]="!isDragging()"
      [class.hover:bg-qc-neutral-bg]="!isDragging()"
    >
      <input
        type="file"
        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
        accept=".png,.jpg,.jpeg,.svg"
        (change)="onFileSelected($event)"
      />

      <div class="w-12 h-12 rounded-qc-card bg-qc-neutral-bg flex items-center justify-center text-qc-accent group-hover:scale-110 transition-transform mb-3">
        <span class="material-symbols-outlined text-2xl">cloud_upload</span>
      </div>

      <p class="text-sm font-semibold text-qc-text">
        Glissez-déposez votre logo ici
      </p>
      <p class="text-xs text-qc-muted mt-1">
        ou <span class="text-qc-accent font-medium underline underline-offset-2">parcourez vos fichiers</span>
      </p>

      <div class="flex items-center gap-2 mt-4 text-[11px] text-qc-muted/80 font-medium">
        <span class="px-2 py-0.5 bg-qc-neutral-bg rounded-md">PNG</span>
        <span class="px-2 py-0.5 bg-qc-neutral-bg rounded-md">SVG</span>
        <span class="px-2 py-0.5 bg-qc-neutral-bg rounded-md">JPG</span>
        <span>•</span>
        <span>Max 2 Mo</span>
      </div>
    </div>
  }
</div>
