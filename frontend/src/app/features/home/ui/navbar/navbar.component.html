<header class="fixed top-0 left-0 right-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(31,32,70,0.04)]">
  <div class="h-20 max-w-[1440px] mx-auto px-margin-sm sm:px-margin flex items-center justify-between gap-space-md">
    <div class="flex items-center gap-space-md">
      <a class="flex items-center gap-space-sm" href="#">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary shadow-sm">
          <span class="material-symbols-outlined text-xl">qr_code_2</span>
        </div>
        <span class="font-title-md text-title-md text-on-surface tracking-tight font-bold">QRCraft</span>
      </a>
    </div>
    <nav class="hidden md:flex items-center gap-space-xs p-space-xs bg-surface-container-low rounded-full">
      <a aria-current="page" class="px-space-md py-space-xs rounded-full transition-all bg-primary-fixed text-on-primary-fixed font-semibold" href="#">Accueil</a>
      <a class="px-space-md py-space-xs rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" href="#simulateur">Studio de Création</a>
      <a class="px-space-md py-space-xs rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" href="#galerie">Modèles &amp; Galerie</a>
      <a class="px-space-md py-space-xs rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" href="#tarifs">Tarifs</a>
    </nav>
    <div class="flex items-center gap-space-md">
      <a class="hidden sm:inline-flex items-center justify-center px-space-lg py-space-sm bg-primary-container text-on-primary font-label-lg text-label-lg rounded-full shadow-[0_4px_20px_-2px_rgba(91,77,255,0.25)] hover:bg-primary transition-all" href="#simulateur">Ouvrir le Studio</a>
      <div class="flex items-center gap-space-sm pl-space-xs">
        <button aria-label="Menu utilisateur" class="p-space-xs rounded-full hover:bg-surface-container-high transition-colors" type="button">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-primary to-secondary-container flex items-center justify-center text-white text-xs font-bold shadow-sm">
            JD
          </div>
        </button>
      </div>

      <!-- Bouton menu mobile : la navigation principale est masquée sous md -->
      <button
        id="mobile-menu-toggle"
        type="button"
        class="md:hidden p-2 -mr-1 rounded-full text-on-surface hover:bg-surface-container-high transition-colors"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
        (click)="toggleMenu()">
        <span class="material-symbols-outlined text-2xl block">{{ menuOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>

  <!-- Panneau de navigation mobile -->
  @if (menuOpen()) {
    <nav
      id="mobile-menu"
      class="md:hidden border-t border-outline-variant/40 bg-surface/95 backdrop-blur-xl px-margin-sm pb-space-md pt-space-sm flex flex-col gap-1"
      aria-label="Navigation principale">
      <a class="px-space-md py-3 rounded-2xl font-label-lg text-label-lg bg-primary-fixed text-on-primary-fixed font-semibold" href="#" (click)="closeMenu()">Accueil</a>
      <a class="px-space-md py-3 rounded-2xl font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container transition-colors" href="#simulateur" (click)="closeMenu()">Studio de Création</a>
      <a class="px-space-md py-3 rounded-2xl font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container transition-colors" href="#galerie" (click)="closeMenu()">Modèles &amp; Galerie</a>
      <a class="px-space-md py-3 rounded-2xl font-label-lg text-label-lg text-on-surface-variant hover:bg-surface-container transition-colors" href="#tarifs" (click)="closeMenu()">Tarifs</a>
      <a class="mt-space-xs px-space-md py-3.5 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg text-center shadow-[0_4px_20px_-2px_rgba(91,77,255,0.25)]" href="#simulateur" (click)="closeMenu()">Ouvrir le Studio</a>
    </nav>
  }
</header>
