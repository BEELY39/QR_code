<app-navbar />
<main class="w-full pt-20 bg-background">
  <div class="flex flex-col w-full overflow-hidden">
    <app-hero-section />
    <app-simulator-section 
      [mode]="simulatorService.mode()"
      [rawValue]="simulatorService.rawValue()"
      [url]="simulatorService.url()"
      [palettes]="simulatorService.palettes()"
      [selectedPalette]="simulatorService.selectedPalette()"
      [bottomText]="simulatorService.bottomText()"
      [displayUrl]="simulatorService.displayUrl()"
      [qrSvgMarkup]="simulatorService.qrSvgMarkup()"
      [isGenerating]="simulatorService.isGenerating()"
      (modeChange)="simulatorService.setMode($event)"
      (valueChange)="simulatorService.setValue($event)"
      (urlChange)="simulatorService.setUrl($event)"
      (paletteSelect)="simulatorService.selectPalette($event)"
      (bottomTextChange)="simulatorService.setBottomText($event)"
      (downloadClick)="simulatorService.downloadSvg()" />
    <app-features-section />
    <app-showcase-section />
    <app-cta-banner />
  </div>
</main>
<app-footer />
