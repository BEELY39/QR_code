<app-site-header />
<main class="w-full bg-white">
  <app-hero-section />
  <app-use-cases-strip />
  <app-static-vs-dynamic />
  <app-model-section />
  <app-tracker-section />

  <!-- Advertisers et créateurs : ordre inversé selon la largeur (FR-023) -->
  <div class="flex w-full flex-col">
    <app-creators-section class="order-1 dk:order-2" />
    <app-advertisers-section class="order-2 dk:order-1" />
  </div>

  <div id="studio" class="scroll-mt-0">
    <app-simulator-section
      [mode]="simulatorService.mode()"
      [rawValue]="simulatorService.rawValue()"
      [url]="simulatorService.url()"
      [palettes]="simulatorService.palettes()"
      [selectedPalette]="simulatorService.selectedPalette()"
      [bottomText]="simulatorService.bottomText()"
      [displayUrl]="simulatorService.displayUrl()"
      [qrSvgMarkup]="simulatorService.qrSvgMarkup()"
      [isGenerating]="simulatorService.isGenerating()"
      [wifiConfig]="simulatorService.wifiConfig()"
      [design]="simulatorService.design()"
      (modeChange)="simulatorService.setMode($event)"
      (wifiConfigChange)="simulatorService.setWifiConfig($event)"
      (designChange)="simulatorService.updateDesign($event)"
      (valueChange)="simulatorService.setValue($event)"
      (urlChange)="simulatorService.setUrl($event)"
      (paletteSelect)="simulatorService.selectPalette($event)"
      (bottomTextChange)="simulatorService.setBottomText($event)"
      (printPackClick)="simulatorService.downloadPrintPack($event.format, $event.withCredit)"
      (downloadClick)="simulatorService.downloadSvg()"
      (downloadPngClick)="simulatorService.downloadPng()" />
  </div>

  <app-privacy-note />
  <app-faq-section />
  <app-cta-banner />
</main>
<app-footer />
