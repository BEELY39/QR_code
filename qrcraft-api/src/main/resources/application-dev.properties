# Profil dev (activé par `./mvnw spring-boot:run`) : valeurs JETABLES, sans usage hors du poste.
# La base est fournie par Docker Compose (compose.yaml). Le préfixe dev-only- est refusé hors
# des profils dev et test (JwtConfig).
qrcraft.security.jwt.secret=dev-only-change-me-0123456789abcdef0123456789
# Identifiant client Google : public (aucun secret Google n'est utilisé)
qrcraft.security.google.client-id=${QRCRAFT_SECURITY_GOOGLE_CLIENT_ID:984838546224-vnk721eak0da8nhvvht54jhdtkoq8cce.apps.googleusercontent.com}
qrcraft.geoip.database-path=${QRCRAFT_GEOIP_DATABASE_PATH:}

# Port 8081 : 8080 est occupé par CrowdSec sur le poste de développement
server.port=8081
# http://localhost : cookie de session sans l'attribut Secure
qrcraft.session.cookie.secure=false
qrcraft.cors.allowed-origins=http://localhost:4200
