# Configuration commune à tous les profils (= production quand aucun profil n'est actif).
# Aucun secret ni URL de base ici : ils viennent de l'environnement
# (cf. specs/012-backend-dependencies/contracts/configuration.md).
spring.application.name=qrcraft-api

# Threads virtuels pour le traitement des requêtes (FR-003)
spring.threads.virtual.enabled=true

# Base mutualisée Dokploy : 5 connexions au plus (FR-004)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Schéma géré par Flyway seul ; l'ORM se contente de valider (principe VII)
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Caches en mémoire : chacun borné en taille et en durée (FR-008)
qrcraft.cache.specs.redirect-rules=maximumSize=10000,expireAfterWrite=5m

# Session : jeton QRCraft de 7 jours sans renouvellement (spec 013, clarification Q2),
# porté par un cookie HttpOnly, SameSite=Strict, Path=/api
qrcraft.security.jwt.ttl=P7D
qrcraft.session.cookie.name=qrcraft_session
qrcraft.session.cookie.secure=true

# Origines du site autorisées à appeler l'API avec le cookie (variable QRCRAFT_CORS_ALLOWED_ORIGINS)
qrcraft.cors.allowed-origins=https://qrcode-craft.fr,https://www.qrcode-craft.fr

# Supervision : uniquement la santé, sans détail (FR-005)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# IP client réelle derrière le proxy de Dokploy ; aucun journal d'accès (FR-012)
server.forward-headers-strategy=framework
